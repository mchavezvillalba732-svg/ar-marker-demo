<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo AR con marcador</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden">
<a-scene embedded vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;">
  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 1"
    position="1 3 2"></a-entity>
  <a-marker preset="hiro">
    <a-entity gltf-model="url(assets/model.glb)"
      scale="10 10 10"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<div style="position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,0.6); color:#fff; border-radius:8px; padding:6px 12px; font-family:system-ui, sans-serif; font-size:14px;">Apunta la cámara al marcador de la mesa</div>
</body>
</html>
